services:

  # ── Backend NestJS ───────────────────────────────────────────
  backend:
    build:
      context: ./pro4tech-backend
      dockerfile: Dockerfile
    image: pro4tech-backend:latest
    container_name: pro4tech_backend
    restart: unless-stopped
    ports:
      - "3333:3333"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - back-net

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pro4tech_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - back-net

  # ── MongoDB ──────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: pro4tech_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - back-net

  # ── MinIO ────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: pro4tech_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data
    ports:
      - "9000:9000"       # API — usada pelo backend
    volumes:
      - minio_data:/data
    networks:
      - back-net

  # ── MinIO Init (roda uma vez e encerra) ──────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: pro4tech_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 5 &&
        mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} &&
        mc mb -p local/$${MINIO_BUCKET} || true &&
        mc anonymous set public local/$${MINIO_BUCKET} || true
      "
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET:     ${MINIO_BUCKET}
    restart: "no"
    networks:
      - back-net

volumes:
  postgres_data:
    name: pro4tech_postgres_data
  mongo_data:
    name: pro4tech_mongo_data
  minio_data:
    name: pro4tech_minio_data

networks:
  back-net:
    driver: bridge